<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two-Factor Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md text-center border border-gray-700">

        <div class="mb-6">
            <div class="mx-auto w-16 h-16 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold">Two-Step Verification</h1>
            <p class="text-gray-400 mt-2 text-sm">Enter the code generated by your Google Authenticator app.</p>
        </div>

        <form method="POST" action="">
            {% csrf_token %}
            
            {% if error %}
            <div class="mb-4 p-3 rounded bg-red-500/10 border border-red-500/50 text-red-500 text-sm">
                {{ error_message }}
            </div>
            {% endif %}

            <div class="mb-6">
                <input 
                    type="text" 
                    name="token" 
                    maxlength="6"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    placeholder="000000"
                    autocomplete="one-time-code"
                    autofocus
                    class="w-full px-4 py-4 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none text-center text-3xl font-bold tracking-[0.5em] transition-all"
                    required
                >
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 py-3.5 rounded-lg font-bold text-white shadow-lg shadow-blue-900/20 transition-all active:scale-[0.98]"
            >
                Verify & Continue
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-700">
            <p class="text-xs text-gray-500">
                Lost your device? <a href="#" class="text-blue-400 hover:underline">Use a backup recovery code</a>
            </p>
        </div>

    </div>
</body>
</html>
